# Porta HTTP do Spring Boot (diferente do Producer)
server.port=9091

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pagamentos-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.messageria.dto.PagamentoDTO

# Tópico consumido
app.topic.pagamento=pagamento.request.topic.v2

# Logging Kafka
logging.level.org.springframework.kafka=INFO
logging.level.com.example.demo=DEBUG

# Regras de Negócio
pagamento.limite-alto-valor=2000