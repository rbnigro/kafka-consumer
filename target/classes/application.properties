# Porta HTTP do Spring Boot (diferente do Producer)
server.port: 9091

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pagamentos-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.DTO

# Tópico consumido
app.topic.pagamento=pagamento.request.topic.v1

# Logging Kafka
logging.level.org.springframework.kafka=INFO
logging.level.com.example.demo=DEBUG